<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h1>My Tasks</h1>
        
        <div class="input-section">
            <input type="text" id="task-input" placeholder="What needs to be done?">
            <button id="add-btn">Add Task</button>
        </div>
        
        <div class="lists-container">
            <!-- Pending Section -->
            <div class="list-section">
                <div class="list-header">
                    <h2>Pending Tasks</h2>
                    <span class="count" id="pending-count">0 pending</span>
                </div>
                <ul id="pending-list" class="task-list"></ul>
                <p id="pending-empty" class="empty-msg">No pending tasks. You're all caught up!</p>
            </div>
            
            <!-- Completed Section -->
            <div class="list-section">
                <div class="list-header">
                    <h2>Completed Tasks</h2>
                    <span class="count" id="completed-count">0 completed</span>
                </div>
                <ul id="completed-list" class="task-list"></ul>
                <p id="completed-empty" class="empty-msg">No completed tasks yet.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
