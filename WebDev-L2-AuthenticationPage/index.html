<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-Side Auth System</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #555;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0052a3;
        }
        .error {
            color: #dc2626;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .toggle-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #0066cc;
            text-decoration: none;
            font-size: 0.875rem;
        }
        .toggle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Registration View -->
    <div id="register-view" class="view">
        <h2>Register</h2>
        <div id="register-error" class="error"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="reg-username">Username or Email</label>
                <input type="text" id="reg-username" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Password (min 8 chars, 1 number)</label>
                <input type="password" id="reg-password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <a href="#" class="toggle-link" onclick="switchView('login-view')">Already have an account? Login</a>
    </div>

    <!-- Login View -->
    <div id="login-view" class="view">
        <h2>Login</h2>
        <div id="login-error" class="error"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Username or Email</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <a href="#" class="toggle-link" onclick="switchView('register-view')">Need an account? Register</a>
    </div>

    <!-- Protected Dashboard View -->
    <div id="dashboard-view" class="view">
        <h2>Dashboard</h2>
        <p>Welcome, <strong id="user-display"></strong>! You have successfully accessed the protected page.</p>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<script>
    // Utility: Hash password using Web Crypto API (SHA-256)
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Utility: View routing logic
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        // Clear forms and errors on switch
        document.getElementById('register-form').reset();
        document.getElementById('login-form').reset();
        hideError('register-error');
        hideError('login-error');
    }

    function showError(elementId, message) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.style.display = 'block';
    }

    function hideError(elementId) {
        document.getElementById(elementId).style.display = 'none';
    }

    // Database simulation using localStorage
    function getUsers() {
        return JSON.parse(localStorage.getItem('users')) || [];
    }

    function saveUser(user) {
        const users = getUsers();
        users.push(user);
        localStorage.setItem('users', JSON.stringify(users));
    }

    // Authentication Logic
    function checkSession() {
        const activeSession = localStorage.getItem('activeSession');
        if (activeSession) {
            document.getElementById('user-display').textContent = activeSession;
            switchView('dashboard-view');
        } else {
            switchView('login-view');
        }
    }

    function logout() {
        localStorage.removeItem('activeSession');
        checkSession();
    }

    // Event Listeners
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError('register-error');

        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;

        // Password Validation
        const passwordRegex = /^(?=.*[0-9]).{8,}$/;
        if (!passwordRegex.test(password)) {
            return showError('register-error', 'Password must be at least 8 characters long and contain at least one number.');
        }

        // Duplicate Check
        const users = getUsers();
        if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
            return showError('register-error', 'User already exists. Please choose a different username or login.');
        }

        // Hash and Save
        const hashedPassword = await hashPassword(password);
        saveUser({ username, password: hashedPassword });
        
        alert('Registration successful! Please login.');
        switchView('login-view');
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError('login-error');

        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;

        const users = getUsers();
        const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

        // Generic Error for both wrong username and wrong password
        const genericErrorMsg = 'Invalid username or password.';

        if (!user) {
            return showError('login-error', genericErrorMsg);
        }

        const hashedPassword = await hashPassword(password);
        if (user.password !== hashedPassword) {
            return showError('login-error', genericErrorMsg);
        }

        // Create Session
        localStorage.setItem('activeSession', user.username);
        checkSession();
    });

    // Initialize App
    checkSession();
</script>
</body>
</html>
